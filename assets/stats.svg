<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300">
  <rect width="820" height="300" fill="#1C1B1F"/>

  <!-- Title -->
  <text x="410" y="34" font-family="Arial, sans-serif" font-size="17" font-weight="700"
    fill="#A855F7" text-anchor="middle" letter-spacing="2">PROJECT STATS</text>
  <line x1="200" y1="44" x2="620" y2="44" stroke="#7C3AED" stroke-width="1" opacity="0.5"/>

  <!-- ── ROW 1: 4 metric cards ── -->
  <!-- Card: Dart files -->
  <rect x="30"  y="60" width="170" height="90" rx="8" fill="#1A0A2E" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="115" y="88"  font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#A855F7" text-anchor="middle">4</text>
  <text x="115" y="110" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Dart source files</text>
  <text x="115" y="126" font-family="Arial, sans-serif" font-size="9"  fill="#4B5563" text-anchor="middle">main · const · home_screen · api_service</text>
  <text x="115" y="140" font-family="Arial, sans-serif" font-size="9"  fill="#7C3AED" text-anchor="middle">lib/</text>

  <!-- Card: Lines of code -->
  <rect x="215" y="60" width="170" height="90" rx="8" fill="#0E1A2E" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="300" y="88"  font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#22D3EE" text-anchor="middle">~320</text>
  <text x="300" y="110" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Lines of Dart</text>
  <text x="300" y="126" font-family="Arial, sans-serif" font-size="9"  fill="#4B5563" text-anchor="middle">excl. generated &amp; platform boilerplate</text>
  <text x="300" y="140" font-family="Arial, sans-serif" font-size="9"  fill="#22D3EE" text-anchor="middle">estimated</text>

  <!-- Card: Platforms -->
  <rect x="400" y="60" width="170" height="90" rx="8" fill="#1A0A10" stroke="#EC4899" stroke-width="1.5"/>
  <text x="485" y="88"  font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#EC4899" text-anchor="middle">6</text>
  <text x="485" y="110" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Target platforms</text>
  <text x="485" y="126" font-family="Arial, sans-serif" font-size="9"  fill="#4B5563" text-anchor="middle">Android · iOS · Web</text>
  <text x="485" y="140" font-family="Arial, sans-serif" font-size="9"  fill="#4B5563" text-anchor="middle">Linux · macOS · Windows</text>

  <!-- Card: Dependencies -->
  <rect x="585" y="60" width="205" height="90" rx="8" fill="#101A10" stroke="#A855F7" stroke-width="1.5"/>
  <text x="688" y="88"  font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#A855F7" text-anchor="middle">5</text>
  <text x="688" y="110" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">pub.dev dependencies</text>
  <text x="688" y="126" font-family="Arial, sans-serif" font-size="9"  fill="#4B5563" text-anchor="middle">cupertino_icons · google_fonts · http</text>
  <text x="688" y="140" font-family="Arial, sans-serif" font-size="9"  fill="#4B5563" text-anchor="middle">switcher_button · flutter_dotenv</text>

  <!-- ── ROW 2: 3 wider metric cards ── -->
  <!-- Card: API model -->
  <rect x="30"  y="168" width="240" height="90" rx="8" fill="#071020" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="150" y="196" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#22D3EE" text-anchor="middle">Gemini 1.5 Flash</text>
  <text x="150" y="214" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">AI model powering responses</text>
  <text x="150" y="232" font-family="Arial, sans-serif" font-size="9"  fill="#4B5563" text-anchor="middle">temp 0.8 · 1 candidate · REST</text>
  <text x="150" y="248" font-family="Arial, sans-serif" font-size="9"  fill="#22D3EE" text-anchor="middle">generativelanguage.googleapis.com</text>

  <!-- Card: Input limit -->
  <rect x="288" y="168" width="240" height="90" rx="8" fill="#1A0A2E" stroke="#EC4899" stroke-width="1.5"/>
  <text x="408" y="196" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#EC4899" text-anchor="middle">500 char cap</text>
  <text x="408" y="214" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Max input before truncation</text>
  <text x="408" y="232" font-family="Arial, sans-serif" font-size="9"  fill="#4B5563" text-anchor="middle">prevents runaway API spend</text>
  <text x="408" y="248" font-family="Arial, sans-serif" font-size="9"  fill="#EC4899" text-anchor="middle">enforced client-side</text>

  <!-- Card: Flutter / Dart version -->
  <rect x="546" y="168" width="244" height="90" rx="8" fill="#101A10" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="668" y="196" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle">Flutter 3.x · Dart ≥3.0.6</text>
  <text x="668" y="214" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Runtime &amp; SDK requirements</text>
  <text x="668" y="232" font-family="Arial, sans-serif" font-size="9"  fill="#4B5563" text-anchor="middle">Material 3 · useMaterial3: true</text>
  <text x="668" y="248" font-family="Arial, sans-serif" font-size="9"  fill="#7C3AED" text-anchor="middle">SDK constraint: &gt;=3.0.6 &lt;4.0.0</text>

  <!-- Footer watermark -->
  <text x="410" y="282" font-family="Arial, sans-serif" font-size="9" fill="#2D2D2D" text-anchor="middle">Pluto v1.0.0 · metrics estimated from source</text>
</svg>
