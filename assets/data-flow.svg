<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <rect width="820" height="400" fill="#1C1B1F"/>

  <!-- Title -->
  <text x="410" y="34" font-family="Arial, sans-serif" font-size="17" font-weight="700"
    fill="#A855F7" text-anchor="middle" letter-spacing="2">DATA FLOW</text>
  <line x1="200" y1="44" x2="620" y2="44" stroke="#7C3AED" stroke-width="1" opacity="0.5"/>

  <!-- ── STAGE BOXES ── -->
  <!-- Stage 1: User Input -->
  <rect x="30" y="165" width="120" height="70" rx="8" fill="#1A0A2E" stroke="#EC4899" stroke-width="2"/>
  <text x="90" y="193" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#EC4899" text-anchor="middle">USER INPUT</text>
  <text x="90" y="208" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">TextField</text>
  <text x="90" y="222" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">≤ 500 chars</text>

  <!-- Arrow 1→2 -->
  <line x1="150" y1="200" x2="188" y2="200" stroke="#EC4899" stroke-width="2" marker-end="url(#df-arrowPink)"/>

  <!-- Stage 2: Mode Select -->
  <rect x="190" y="165" width="120" height="70" rx="8" fill="#1A0A2E" stroke="#7C3AED" stroke-width="2"/>
  <text x="250" y="190" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#A855F7" text-anchor="middle">MODE SELECT</text>
  <text x="250" y="205" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">SwitcherButton</text>
  <text x="250" y="220" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">flirtyMode: bool</text>

  <!-- Branch lines from Mode Select down to two paths -->
  <line x1="250" y1="235" x2="250" y2="265" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="250" y1="265" x2="175" y2="265" stroke="#EC4899" stroke-width="1.5"/>
  <line x1="250" y1="265" x2="325" y2="265" stroke="#22D3EE" stroke-width="1.5"/>

  <!-- Branch label: Cupid -->
  <text x="140" y="275" font-family="Arial, sans-serif" font-size="9" fill="#EC4899" text-anchor="middle">💘 Cupid</text>
  <!-- Branch label: G Man -->
  <text x="360" y="275" font-family="Arial, sans-serif" font-size="9" fill="#22D3EE" text-anchor="middle">🧠 G Man</text>

  <!-- Cupid prompt box -->
  <rect x="100" y="280" width="150" height="44" rx="6" fill="#1A0A2E" stroke="#EC4899" stroke-width="1.5"/>
  <text x="175" y="298" font-family="Arial, sans-serif" font-size="9" fill="#EC4899" text-anchor="middle" font-weight="700">Flirty Prompt</text>
  <text x="175" y="312" font-family="Arial, sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">"Give a romantic pickup line…"</text>
  <!-- line from branch to cupid box -->
  <line x1="175" y1="265" x2="175" y2="279" stroke="#EC4899" stroke-width="1.5" marker-end="url(#df-arrowPink)"/>

  <!-- G Man prompt box -->
  <rect x="250" y="280" width="150" height="44" rx="6" fill="#0E1A2E" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="325" y="298" font-family="Arial, sans-serif" font-size="9" fill="#22D3EE" text-anchor="middle" font-weight="700">Witty Prompt</text>
  <text x="325" y="312" font-family="Arial, sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">"Highly intelligent witty reply…"</text>
  <!-- line from branch to gman box -->
  <line x1="325" y1="265" x2="325" y2="279" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#df-arrowCyan)"/>

  <!-- Lines merging back to Prompt Build -->
  <line x1="175" y1="324" x2="175" y2="340" stroke="#EC4899" stroke-width="1.5"/>
  <line x1="325" y1="324" x2="325" y2="340" stroke="#22D3EE" stroke-width="1.5"/>
  <line x1="175" y1="340" x2="250" y2="340" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="250" y1="340" x2="325" y2="340" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="250" y1="340" x2="250" y2="352" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#df-arrowPurple)"/>

  <!-- Arrow 2→3 (main flow above branches, from mode select to prompt builder) -->
  <line x1="310" y1="200" x2="348" y2="200" stroke="#7C3AED" stroke-width="2" marker-end="url(#df-arrowPurple)"/>

  <!-- Stage 3: Prompt Builder -->
  <rect x="350" y="165" width="130" height="70" rx="8" fill="#0E1A2E" stroke="#7C3AED" stroke-width="2"/>
  <text x="415" y="190" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#A855F7" text-anchor="middle">PROMPT BUILD</text>
  <text x="415" y="206" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">ApiService</text>
  <text x="415" y="221" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">promptText compose</text>

  <!-- Arrow 3→4 -->
  <line x1="480" y1="200" x2="518" y2="200" stroke="#22D3EE" stroke-width="2" marker-end="url(#df-arrowCyan)"/>

  <!-- Stage 4: HTTP POST -->
  <rect x="520" y="165" width="130" height="70" rx="8" fill="#0A1A20" stroke="#22D3EE" stroke-width="2"/>
  <text x="585" y="188" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#22D3EE" text-anchor="middle">HTTP POST</text>
  <text x="585" y="203" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">http.post()</text>
  <text x="585" y="218" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">?key=API_KEY</text>

  <!-- Arrow 4→5 -->
  <line x1="650" y1="200" x2="688" y2="200" stroke="#22D3EE" stroke-width="2" marker-end="url(#df-arrowCyan)"/>

  <!-- Stage 5: Gemini API -->
  <rect x="690" y="148" width="110" height="104" rx="8" fill="#071020" stroke="#22D3EE" stroke-width="2.5"/>
  <text x="745" y="175" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#22D3EE" text-anchor="middle">GEMINI</text>
  <text x="745" y="190" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#22D3EE" text-anchor="middle">1.5 FLASH</text>
  <text x="745" y="206" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Google API</text>
  <text x="745" y="220" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">temp: 0.8</text>
  <text x="745" y="234" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">candidates: 1</text>

  <!-- Return path: 200 OK -->
  <path d="M 745 252 Q 745 360 415 360 Q 180 360 100 310"
    fill="none" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="6,3"
    marker-end="url(#df-arrowLight)"/>
  <text x="560" y="356" font-family="Arial, sans-serif" font-size="9" fill="#A855F7">200 OK → candidates[0].content.parts[0].text</text>

  <!-- Error path from HTTP POST -->
  <rect x="520" y="96" width="130" height="44" rx="6" fill="#200A0A" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="585" y="115" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#EC4899" text-anchor="middle">ERROR STATE</text>
  <text x="585" y="130" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">status != 200</text>
  <line x1="585" y1="165" x2="585" y2="141" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#df-arrowPink)"/>

  <!-- Loading indicator stage -->
  <rect x="350" y="60" width="130" height="44" rx="6" fill="#1C1B1F" stroke="#6B7280" stroke-width="1.5"/>
  <text x="415" y="79" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">LOADING STATE</text>
  <text x="415" y="94" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">CircularProgressIndicator</text>
  <!-- arrow from prompt build to loading -->
  <line x1="415" y1="165" x2="415" y2="105" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#df-arrowGray)"/>

  <!-- Response display stage -->
  <rect x="30" y="310" width="200" height="60" rx="8" fill="#1A0A2E" stroke="#EC4899" stroke-width="2"/>
  <text x="130" y="334" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#EC4899" text-anchor="middle">RESPONSE DISPLAY</text>
  <text x="130" y="350" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">setState() → _responseText</text>
  <text x="130" y="364" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Text widget · SingleChildScrollView</text>

  <!-- Step numbers -->
  <circle cx="90"  cy="160" r="10" fill="#EC4899"/>
  <text x="90"  cy="165" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle" y="164">1</text>
  <circle cx="250" cy="160" r="10" fill="#7C3AED"/>
  <text x="250" cy="165" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle" y="164">2</text>
  <circle cx="415" cy="160" r="10" fill="#7C3AED"/>
  <text x="415" cy="165" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle" y="164">3</text>
  <circle cx="585" cy="160" r="10" fill="#22D3EE"/>
  <text x="585" cy="165" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#1C1B1F" text-anchor="middle" dominant-baseline="middle" y="164">4</text>
  <circle cx="745" cy="143" r="10" fill="#22D3EE"/>
  <text x="745" cy="148" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#1C1B1F" text-anchor="middle" dominant-baseline="middle" y="147">5</text>

  <defs>
    <marker id="df-arrowPink" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#EC4899"/>
    </marker>
    <marker id="df-arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7C3AED"/>
    </marker>
    <marker id="df-arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22D3EE"/>
    </marker>
    <marker id="df-arrowLight" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#A855F7"/>
    </marker>
    <marker id="df-arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6B7280"/>
    </marker>
  </defs>
</svg>
