<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460">
  <rect width="820" height="460" fill="#1C1B1F"/>

  <!-- Title -->
  <text x="410" y="36" font-family="Arial, sans-serif" font-size="17" font-weight="700"
    fill="#A855F7" text-anchor="middle" letter-spacing="2">SYSTEM ARCHITECTURE</text>
  <line x1="200" y1="46" x2="620" y2="46" stroke="#7C3AED" stroke-width="1" opacity="0.5"/>

  <!-- ═══════════ LAYER LABELS ═══════════ -->
  <!-- UI Layer label -->
  <rect x="18" y="68" width="80" height="100" rx="4" fill="none" stroke="#EC4899" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <text x="58" y="122" font-family="Arial, sans-serif" font-size="9" fill="#EC4899" text-anchor="middle" opacity="0.7" transform="rotate(-90,58,122)">UI LAYER</text>

  <!-- Logic Layer label -->
  <rect x="18" y="198" width="80" height="100" rx="4" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <text x="58" y="252" font-family="Arial, sans-serif" font-size="9" fill="#7C3AED" text-anchor="middle" opacity="0.7" transform="rotate(-90,58,252)">LOGIC LAYER</text>

  <!-- Service Layer label -->
  <rect x="18" y="328" width="80" height="110" rx="4" fill="none" stroke="#22D3EE" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <text x="58" y="386" font-family="Arial, sans-serif" font-size="9" fill="#22D3EE" text-anchor="middle" opacity="0.7" transform="rotate(-90,58,386)">SERVICE LAYER</text>

  <!-- ═══════════ UI COMPONENTS ═══════════ -->
  <!-- MyApp widget -->
  <rect x="120" y="72" width="160" height="56" rx="8" fill="#2D1B4E" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="200" y="96" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#A855F7" text-anchor="middle">MyApp</text>
  <text x="200" y="113" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">MaterialApp entry point</text>

  <!-- HomeScreen widget -->
  <rect x="360" y="72" width="180" height="56" rx="8" fill="#2D1B4E" stroke="#EC4899" stroke-width="1.5"/>
  <text x="450" y="96" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#EC4899" text-anchor="middle">HomeScreen</text>
  <text x="450" y="113" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">StatefulWidget – main UI</text>

  <!-- AppBar -->
  <rect x="590" y="72" width="140" height="56" rx="8" fill="#1A2A1A" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="660" y="96" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#22D3EE" text-anchor="middle">AppBar</text>
  <text x="660" y="113" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Title + mode toggle</text>

  <!-- ═══════════ LOGIC COMPONENTS ═══════════ -->
  <!-- _HomeScreenState -->
  <rect x="240" y="202" width="200" height="60" rx="8" fill="#2D1B4E" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="340" y="227" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#A855F7" text-anchor="middle">_HomeScreenState</text>
  <text x="340" y="244" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">mode, input, loading, response</text>

  <!-- SwitcherButton -->
  <rect x="490" y="202" width="140" height="60" rx="8" fill="#1A2A1A" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="560" y="227" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#22D3EE" text-anchor="middle">SwitcherButton</text>
  <text x="560" y="244" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Cupid ↔ G Man toggle</text>

  <!-- TextEditingController -->
  <rect x="678" y="202" width="122" height="60" rx="8" fill="#1E1E1E" stroke="#EC4899" stroke-width="1.5"/>
  <text x="739" y="223" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#EC4899" text-anchor="middle">TextEditing</text>
  <text x="739" y="238" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#EC4899" text-anchor="middle">Controller</text>
  <text x="739" y="254" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">user input field</text>

  <!-- ═══════════ SERVICE COMPONENTS ═══════════ -->
  <!-- ApiService -->
  <rect x="240" y="334" width="180" height="60" rx="8" fill="#0E2030" stroke="#22D3EE" stroke-width="2"/>
  <text x="330" y="358" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#22D3EE" text-anchor="middle">ApiService</text>
  <text x="330" y="375" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">generateResponse()</text>

  <!-- flutter_dotenv -->
  <rect x="470" y="334" width="130" height="60" rx="8" fill="#1E1E1E" stroke="#A855F7" stroke-width="1.5"/>
  <text x="535" y="358" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#A855F7" text-anchor="middle">flutter_dotenv</text>
  <text x="535" y="375" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">API_KEY from .env</text>

  <!-- Gemini API -->
  <rect x="640" y="334" width="160" height="60" rx="8" fill="#0D1A2A" stroke="#22D3EE" stroke-width="2"/>
  <text x="720" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#22D3EE" text-anchor="middle">Gemini 1.5 Flash</text>
  <text x="720" y="371" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">REST API (Google)</text>
  <text x="720" y="385" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">generateContent endpoint</text>

  <!-- ═══════════ ARROWS ═══════════ -->
  <!-- MyApp → HomeScreen -->
  <line x1="280" y1="100" x2="358" y2="100" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <!-- HomeScreen → AppBar -->
  <line x1="540" y1="100" x2="588" y2="100" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <!-- HomeScreen → _HomeScreenState -->
  <line x1="450" y1="128" x2="380" y2="200" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
  <!-- _HomeScreenState → SwitcherButton -->
  <line x1="440" y1="232" x2="488" y2="232" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <!-- _HomeScreenState → TextEditingController -->
  <line x1="678" y1="232" x2="642" y2="232" stroke="#EC4899" stroke-width="1.5" marker-end="url(#arrowPink)" transform="rotate(180,660,232)"/>
  <!-- _HomeScreenState → ApiService -->
  <line x1="330" y1="262" x2="330" y2="332" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <!-- ApiService → flutter_dotenv -->
  <line x1="420" y1="364" x2="468" y2="364" stroke="#A855F7" stroke-width="1.5" marker-end="url(#arrowLight)"/>
  <!-- ApiService → Gemini -->
  <line x1="420" y1="374" x2="638" y2="374" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowCyan)"/>
  <!-- Gemini → ApiService (return) -->
  <line x1="638" y1="355" x2="422" y2="355" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowPink)"/>

  <!-- Legend -->
  <rect x="120" y="420" width="580" height="32" rx="6" fill="#111111" opacity="0.6"/>
  <line x1="140" y1="436" x2="165" y2="436" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="170" y="440" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">widget tree</text>
  <line x1="260" y1="436" x2="285" y2="436" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="290" y="440" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">data / calls</text>
  <line x1="380" y1="436" x2="405" y2="436" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="410" y="440" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">response / events</text>
  <line x1="530" y1="436" x2="555" y2="436" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="560" y="440" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">state relationship</text>

  <defs>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowPink" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#EC4899"/>
    </marker>
    <marker id="arrowLight" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#A855F7"/>
    </marker>
  </defs>
</svg>
